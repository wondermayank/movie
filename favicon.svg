<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0B1020"/>
<stop offset="100%" stop-color="#1E293B"/>
</linearGradient>

<linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFD54A"/>
<stop offset="100%" stop-color="#FF9800"/>
</linearGradient>
</defs>

<!-- Background -->
<rect width="64" height="64" rx="16" fill="url(#bg)"/>

<!-- Film -->
<rect x="14" y="16" width="36" height="32" rx="6"
fill="url(#film)"/>

<!-- Film holes -->
<rect x="18" y="20" width="4" height="4" rx="1" fill="#111"/>
<rect x="18" y="28" width="4" height="4" rx="1" fill="#111"/>
<rect x="18" y="36" width="4" height="4" rx="1" fill="#111"/>

<rect x="42" y="20" width="4" height="4" rx="1" fill="#111"/>
<rect x="42" y="28" width="4" height="4" rx="1" fill="#111"/>
<rect x="42" y="36" width="4" height="4" rx="1" fill="#111"/>

<!-- Play icon -->
<path d="M28 24L38 32L28 40Z" fill="white"/>

</svg>
